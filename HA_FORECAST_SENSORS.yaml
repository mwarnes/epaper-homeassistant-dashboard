# Home Assistant Template Sensors for Daily Weather Forecast
# Add this to your Home Assistant configuration.yaml or create a new file
# in packages/ or templates/ directory depending on your setup

# Weather Forecast Template Sensors
# These extract daily forecast data from weather.forecast_langebaan
# Provides: temperature and condition for the next 5 days

template:
  - sensor:
      # ============================================
      # TODAY MIN/MAX TEMPERATURES
      # ============================================
      - name: "Forecast Today Temp High"
        unique_id: forecast_today_temp_high
        state: >
          {% set forecast = state_attr('weather.forecast_langebaan', 'forecast') %}
          {% if forecast and forecast|length > 0 %}
            {{ forecast[0].temperature }}
          {% else %}
            unavailable
          {% endif %}
        unit_of_measurement: "°C"
        device_class: temperature
        
      - name: "Forecast Today Temp Low"
        unique_id: forecast_today_temp_low
        state: >
          {% set forecast = state_attr('weather.forecast_langebaan', 'forecast') %}
          {% if forecast and forecast|length > 0 %}
            {{ forecast[0].templow }}
          {% else %}
            unavailable
          {% endif %}
        unit_of_measurement: "°C"
        device_class: temperature
      
      # ============================================
      # DAY 1 FORECAST (Tomorrow)
      # ============================================
      - name: "Forecast Day 1 Temperature"
        unique_id: forecast_day1_temperature
        state: >
          {% set forecast = state_attr('weather.forecast_langebaan', 'forecast') %}
          {% if forecast and forecast|length > 1 %}
            {{ forecast[1].temperature }}
          {% else %}
            unavailable
          {% endif %}
        unit_of_measurement: "°C"
        device_class: temperature
        
      - name: "Forecast Day 1 Condition"
        unique_id: forecast_day1_condition
        state: >
          {% set forecast = state_attr('weather.forecast_langebaan', 'forecast') %}
          {% if forecast and forecast|length > 1 %}
            {{ forecast[1].condition }}
          {% else %}
            unavailable
          {% endif %}
        icon: mdi:weather-partly-cloudy
        
      - name: "Forecast Day 1 Name"
        unique_id: forecast_day1_name
        state: >
          {% set forecast = state_attr('weather.forecast_langebaan', 'forecast') %}
          {% if forecast and forecast|length > 1 %}
            {{ as_timestamp(forecast[1].datetime) | timestamp_custom('%a') }}
          {% else %}
            unavailable
          {% endif %}
        icon: mdi:calendar
      
      # ============================================
      # DAY 2 FORECAST
      # ============================================
      - name: "Forecast Day 2 Temperature"
        unique_id: forecast_day2_temperature
        state: >
          {% set forecast = state_attr('weather.forecast_langebaan', 'forecast') %}
          {% if forecast and forecast|length > 2 %}
