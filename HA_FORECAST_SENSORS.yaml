        icon: mdi:calendar

# ============================================
# NOTES:
# ============================================
# 1. Add this to your configuration.yaml:
#    template: !include templates.yaml
#    (Then save this as templates.yaml)
#
# 2. Or add directly to configuration.yaml under "template:" section
#
# 3. After adding, restart Home Assistant or reload template entities
#
# 4. Verify in Developer Tools > States:
#    - sensor.forecast_day1_temperature
#    - sensor.forecast_day1_condition
#    - sensor.forecast_day1_name
#    (and so on for days 2-5)
#
# 5. Each day provides:
#    - Temperature (e.g., "22.5")
#    - Condition (e.g., "partlycloudy")
#    - Day name (e.g., "Sat", "Sun", "Mon")
#
# 6. The forecast array structure from weather.forecast_langebaan:
#    forecast[0] = Today (not used - shown in main weather display)
#    forecast[1] = Tomorrow (Day 1)
#    forecast[2] = Day 2
#    forecast[3] = Day 3
#    forecast[4] = Day 4
#    forecast[5] = Day 5
