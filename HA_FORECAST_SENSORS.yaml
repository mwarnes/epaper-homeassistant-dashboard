        state: >
          {% set forecast = state_attr('weather.forecast_langebaan', 'forecast') %}
          {% if forecast and forecast|length > 2 %}
            {{ forecast[2].condition }}
          {% else %}
            unavailable
          {% endif %}
        icon: mdi:weather-partly-cloudy
        
      - name: "Forecast Day 2 Name"
        unique_id: forecast_day2_name
        state: >
          {% set forecast = state_attr('weather.forecast_langebaan', 'forecast') %}
          {% if forecast and forecast|length > 2 %}
            {{ as_timestamp(forecast[2].datetime) | timestamp_custom('%a') }}
          {% else %}
            unavailable
          {% endif %}
        icon: mdi:calendar
      
      # ============================================
      # DAY 3 FORECAST
      # ============================================
